<html>
<header>
    <title>Personal Finance App</title>
    <!-- <link rel="stylesheet" type="text/css" href="style.css"> -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-size: 14px;
        }

        #page_title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
            color: white;
        }

        #page_title h1 {
            margin: 0;
        }

        .nav_links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav_link {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background-color: #2196F3;
            border-radius: 5px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .nav_link:hover {
            background-color: #1976D2;
        }

        .nav_link.green {
            background-color: #4CAF50;
        }

        .nav_link.green:hover {
            background-color: #45a049;
        }

        .nav_link:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        .overview_container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px;
            background-color: white;
            border-radius: 5px;
            padding: 20px 20px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .overview_card {
            flex: 1;
            min-width: 300px;
        }

        .overview {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            font-size: 16px;
            border-bottom: 1px solid #f0f0f0;
        }

        .overview:last-child {
            border-bottom: none;
        }

        .overview_title {
            font-weight: bold;
        }

        .overview_value {
            font-weight: bold;
        }

        .chart_container {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .table_view {
            display: flex;
            flex-wrap: wrap;
            padding: 10px;
        }

        .row {
            margin: 10px;
            background-color: white;
            border-radius: 5px;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            flex: 1 1 250px;
        }

        .mainrow {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .row_title {
            font-weight: bold;
        }

        .row_value {
            text-align: right;
            font-weight: bold;
        }

        .subrow {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            margin-left: 20px;
            font-size: 15px;
        }

        .subrow_title {
            font-weight: bold;
        }

        .subrow_value {
            text-align: right;
            font-weight: bold;
            /* // trim number to 2 decimal */
            
        }

        .error_banner {
            background-color: #ffebee;
            border: 1px solid #f44336;
            border-radius: 5px;
            padding: 10px 15px;
            margin: 20px;
            color: #c62828;
            display: none;
        }

        .error_banner.visible {
            display: block;
        }

        .error_title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .error_list {
            font-size: 14px;
        }
    </style>
</header>
<body>
    <div id="page_title">
        <h1>💰 Networth</h1>
        <div class="nav_links">
            <a href="history.html" class="nav_link">📊 History</a>
                <a href="assets.html" class="nav_link">📈 Assets</a>
            <button id="refresh_button" class="nav_link green" onclick="renderPortfolio(true)">🔄 Refresh</button>
        </div>
    </div>
    <div id="error_banner" class="error_banner">
        <div class="error_title">⚠️ Failed to fetch some data:</div>
        <div id="error_list" class="error_list"></div>
    </div>
    <div class="overview_container">
        <div class="overview_card">
            <div class="overview">
                <div class="overview_title">Total:</div>
                <div id="total_value" class="overview_value">?</div>
            </div>
            <div class="overview">
                <div class="overview_title">Delta year to date</div>
                <div id="delta_value" class="overview_value">?</div>
            </div>
            <div class="overview">
                <div class="overview_title">Prev Month Delta</div>
                <div id="prevMonth_delta_value" class="overview_value">?</div>
            </div>
        </div>
        <div class="chart_container">
            <canvas id="portfolio_chart" width="300" height="250"></canvas>
        </div>
    </div>
    <div id="table_view" class="table_view">
        <!-- Dynamically rendered -->
    </div>
</body>
<script src="chart.js"></script>
<script>
    // Configuration for category-specific behavior
    const categoryConfig = {
        Equity: {},
        Crypto: {},
        Liquidity: {},
        Gold: {}
    };

    const t = (number) => number.toFixed(2);
    const pct = (value, total) => ((value / total) * 100).toFixed(1);

    // Function to render a single category row
    const renderCategoryRow = (categoryKey, categoryData, portfolioTotal) => {
        if (!categoryData) return '';

        const categoryPct = pct(categoryData.total, portfolioTotal);
        let mainRowValueHtml = `${t(categoryData.total)} (${categoryPct}%)`;

        // Render subrows for details using displayName from API
        let subrowsHtml = '';
        if (categoryData.details) {
            for (const [key, detail] of Object.entries(categoryData.details)) {
                const label = detail.displayName || key;
                const assetPct = pct(detail.total, portfolioTotal);
                subrowsHtml += `
                    <div class="subrow">
                        <div class="subrow_title">${label}:</div>
                        <div class="subrow_value">${t(detail.total)} (${assetPct}%)</div>
                    </div>
                `;
            }
        }

        return `
            <div class="row">
                <div class="mainrow">
                    <div class="row_title">${categoryKey}:</div>
                    <div class="row_value">${mainRowValueHtml}</div>
                </div>
                ${subrowsHtml}
            </div>
        `;
    };

    // Function to render the entire table view
    const renderTableView = (portfolio) => {
        const tableView = document.getElementById('table_view');
        let html = '';

        // Render each category in order (by viewGroup)
        const categoryOrder = ['Equity', 'Crypto', 'Liquidity', 'Gold'];
        for (const categoryKey of categoryOrder) {
            if (portfolio[categoryKey]) {
                html += renderCategoryRow(categoryKey, portfolio[categoryKey], portfolio.total);
            }
        }

        tableView.innerHTML = html;
    };

    const fetchData = async (refresh) => {
        const response = await fetch('http://localhost:8085/portfolio?refresh=' + refresh);
        const data = await response.json();
        return data;
    }

    const getPortfolio = async (refresh) => {
        let portfolio = JSON.parse(localStorage.getItem('portfolio') || null) || null;
        // Force refresh if displayName is missing or viewGroups are missing (cache from old version)
        const needsRefresh = portfolio && (
            (portfolio.Equity?.details && Object.values(portfolio.Equity.details).some(d => !d.displayName)) ||
            !portfolio.Gold ||
            !portfolio.Equity
        );
        if (portfolio === null || refresh || needsRefresh) {
            const refreshButton = document.getElementById('refresh_button');
            const originalLabel = refreshButton.innerHTML;
            refreshButton.disabled = true;
            refreshButton.innerHTML = 'Refreshing...';
            try {
                const newPortfolio = await fetchData(refresh);
                localStorage.setItem('portfolio', JSON.stringify(newPortfolio));
                return newPortfolio;
            } finally {
                refreshButton.disabled = false;
                refreshButton.innerHTML = originalLabel;
            }
        }
        return portfolio;
    }

    const renderPortfolio = async (refresh) => {
        // Show cached data first (if available) so old values remain visible during refresh
        let portfolio = JSON.parse(localStorage.getItem('portfolio') || null);
        if (portfolio) {
            renderPortfolioData(portfolio);
        }
        
        // Fetch new data if needed
        portfolio = await getPortfolio(refresh);
        renderPortfolioData(portfolio);
    }

    const renderPortfolioData = (portfolio) => {
        const total = portfolio.total;
        const prevMonthTotal = portfolio.prevMonthTotal;
        const initYearNetworth = portfolio.initYearNetworth;

        const delta = total - initYearNetworth;
        const deltaPercentage = (delta / initYearNetworth) * 100;
        const deltaPercentageLabel = deltaPercentage > 0 ? '🚀' : '🔥';
        const prevMonthdelta = total - prevMonthTotal;
        const prevMonthdeltaPercentage = (prevMonthdelta / prevMonthTotal) * 100;
        const prevMonthdeltaPercentageLabel = prevMonthdeltaPercentage > 0 ? '🚀' : '🔥';

        // Update overview values
        document.getElementById('total_value').innerHTML = t(total);
        document.getElementById('delta_value').innerHTML = `${t(delta)} (${t(deltaPercentage)}%) ${deltaPercentageLabel}`;
        document.getElementById('prevMonth_delta_value').innerHTML = `${t(prevMonthdelta)} (${t(prevMonthdeltaPercentage)}%) ${prevMonthdeltaPercentageLabel}`;

        // Show/hide error banner based on failures
        const errorBanner = document.getElementById('error_banner');
        const errorList = document.getElementById('error_list');
        if (portfolio.failures && portfolio.failures.length > 0) {
            errorList.innerHTML = portfolio.failures.join(', ') + ' (using cached values if available)';
            errorBanner.classList.add('visible');
        } else {
            errorBanner.classList.remove('visible');
        }

        // Render the table view dynamically
        renderTableView(portfolio);

        // Render the pie chart
        ChartModule.renderPieChart('portfolio_chart', portfolio);
    }

    renderPortfolio();
</script>
</html>
