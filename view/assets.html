<html>
<head>
    <title>Assets Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-size: 14px;
        }

        #page_title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background-color: #333;
            color: white;
        }

        #page_title h1 {
            margin: 0;
        }

        .nav_links {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .nav_link {
            color: white;
            text-decoration: none;
            padding: 10px 20px;
            background-color: #2196F3;
            border-radius: 5px;
            font-size: 14px;
            border: none;
            cursor: pointer;
            display: inline-block;
        }

        .nav_link:hover {
            background-color: #1976D2;
        }

        .nav_link.green {
            background-color: #4CAF50;
        }

        .nav_link.green:hover {
            background-color: #45a049;
        }

        .nav_link.red {
            background-color: #e53935;
        }

        .nav_link.red:hover {
            background-color: #c62828;
        }

        .container {
            margin: 20px;
            background-color: white;
            border-radius: 5px;
            padding: 20px;
        }

        .section_title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
            color: #333;
        }

        .toolbar {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 15px;
        }

        .hint {
            color: #666;
            font-size: 12px;
            margin-top: 6px;
        }

        .error_banner {
            background-color: #ffebee;
            border: 1px solid #f44336;
            border-radius: 5px;
            padding: 10px 15px;
            margin: 20px;
            color: #c62828;
            display: none;
        }

        .error_banner.visible {
            display: block;
        }

        .success_banner {
            background-color: #e8f5e9;
            border: 1px solid #4CAF50;
            border-radius: 5px;
            padding: 10px 15px;
            margin: 20px;
            color: #1b5e20;
            display: none;
        }

        .success_banner.visible {
            display: block;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #e0e0e0;
            text-align: left;
            vertical-align: middle;
        }

        th {
            background-color: #f5f5f5;
            font-weight: bold;
            color: #333;
        }

        td.actions {
            width: 260px;
            white-space: nowrap;
            text-align: right;
        }

        input, select {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 14px;
        }

        .inline {
            display: inline-flex;
            gap: 8px;
            align-items: center;
        }

        .btn {
            padding: 8px 12px;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 14px;
        }

        .btn.primary {
            background-color: #2196F3;
            color: white;
        }

        .btn.primary:hover {
            background-color: #1976D2;
        }

        .btn.success {
            background-color: #4CAF50;
            color: white;
        }

        .btn.success:hover {
            background-color: #45a049;
        }

        .btn.danger {
            background-color: #e53935;
            color: white;
        }

        .btn.danger:hover {
            background-color: #c62828;
        }

        .btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
            color: #333;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
    </style>
</head>
<body>
    <div id="page_title">
        <h1>💼 Assets</h1>
        <div class="nav_links">
            <a href="dashboard.html" class="nav_link">🏠 Dashboard</a>
            <a href="history.html" class="nav_link">📊 History</a>
        </div>
    </div>

    <div id="error_banner" class="error_banner"></div>
    <div id="success_banner" class="success_banner"></div>

    <div class="container">
        <div class="section_title">Manage assets</div>
        <div class="toolbar">
            <button id="reload_btn" class="btn primary" onclick="loadSchema()">Reload</button>
            <button id="add_btn" class="btn success" onclick="addNewRow()">Add asset</button>
            <button id="save_btn" class="btn primary" onclick="saveAll()">Save all</button>
        </div>
        <div class="hint">
            Schema: <span class="mono">[assetClass, assetId, quantity, displayName, viewGroup]</span>. Asset IDs must be unique.
        </div>

        <div style="margin-top: 15px; overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th style="min-width: 130px;">Asset class</th>
                        <th style="min-width: 180px;">Asset ID</th>
                        <th style="min-width: 120px;">Quantity</th>
                        <th style="min-width: 220px;">Display name</th>
                        <th style="min-width: 140px;">View group</th>
                        <th style="min-width: 200px; text-align:right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="assets_tbody"></tbody>
            </table>
        </div>
    </div>

    <script src="assets.js"></script>
</body>
</html>
