<html>
<header>
    <title>Personal Finance App</title>
    <!-- <link rel="stylesheet" type="text/css" href="style.css"> -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            font-size: 20px;
        }

        #page_title {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: #333;
            color: white;
        }

        .overview {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            background-color: white;
            margin: 20px;
            border-radius: 5px;
        }

        .overview_title {
            font-weight: bold;
        }

        .overview_value {
            font-weight: bold;
        }

        .table_view {
            display: flex;
        }

        .row {
            margin: 20px;
            background-color: white;
            border-radius: 5px;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            width: 100%;
            min-width: fit-content;
            flex-wrap: wrap;
        }

        .mainrow {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }

        .row_title {
            font-weight: bold;
        }

        .row_value {
            text-align: right;
            font-weight: bold;
        }

        .row_value_details {
            display: flex;
            align-items: center;
            font-size: 1rem;
            color: red;
            justify-content: flex-end;
        }

        .subrow {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
            margin-left: 20px;
            font-size: 15px;
        }

        .subrow_title {
            font-weight: bold;
        }

        .subrow_value {
            text-align: right;
            font-weight: bold;
            /* // trim number to 2 decimal */
            
        }

        #refresh_button {
            background-color: #4CAF50;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 4px 2px;
            cursor: pointer;
            border-radius: 5px;
            width: 150px;
        }
        #refresh_button:disabled {
            background-color: #cccccc;
        }

        .error_banner {
            background-color: #ffebee;
            border: 1px solid #f44336;
            border-radius: 5px;
            padding: 10px 15px;
            margin: 20px;
            color: #c62828;
            display: none;
        }

        .error_banner.visible {
            display: block;
        }

        .error_title {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .error_list {
            font-size: 14px;
        }
    </style>
</header>
<body>
    <div id="page_title">
        <h1>Networth</h1>
        <button id="refresh_button" onclick="renderPortfolio(true)">Refresh</button>
    </div>
    <div id="error_banner" class="error_banner">
        <div class="error_title">⚠️ Failed to fetch some data:</div>
        <div id="error_list" class="error_list"></div>
    </div>
    <div class="overview">
        <div class="overview_title">Total:</div>
        <div id="total_value" class="overview_value">?</div>
    </div>
    <div class="overview">
        <div class="overview_title">Delta year to goal</div>
        <div id="deltagoal_value" class="overview_value">?</div>
    </div>
    <div class="overview">
        <div class="overview_title">Delta year to date</div>
        <div id="delta_value" class="overview_value">?</div>
    </div>
    <div class="overview">
        <div class="overview_title">Prev Month Delta</div>
        <div id="prevMonth_delta_value" class="overview_value">?</div>
    </div>
    <div id="table_view" class="table_view">
        <!-- Dynamically rendered -->
    </div>
</body>
<script>
    // Configuration for category-specific behavior
    const categoryConfig = {
        Equity: {},
        Crypto: {
            showRiskValue: true // Special handling for crypto on risk
        },
        Liquidity: {},
        Commodities: {}
    };

    const t = (number) => number.toFixed(2);

    // Function to render a single category row
    const renderCategoryRow = (categoryKey, categoryData) => {
        const config = categoryConfig[categoryKey] || {};
        if (!categoryData) return '';

        let mainRowValueHtml = t(categoryData.total);
        
        // Special handling for Crypto to show risk value
        if (config.showRiskValue && categoryData.details?.USDT) {
            const cryptoOnRisk = Math.floor(categoryData.total - categoryData.details.USDT.total);
            mainRowValueHtml = `
                <div class="row_value_withdetails">
                    <div class="row_value">${t(categoryData.total)}</div>
                    <div class="row_value_details">
                        <div>${t(cryptoOnRisk)}</div>🔥
                    </div>
                </div>
            `;
        }

        // Render subrows for details using displayName from API
        let subrowsHtml = '';
        if (categoryData.details) {
            for (const [key, detail] of Object.entries(categoryData.details)) {
                const label = detail.displayName || key;
                subrowsHtml += `
                    <div class="subrow">
                        <div class="subrow_title">${label}:</div>
                        <div class="subrow_value">${t(detail.total)}</div>
                    </div>
                `;
            }
        }

        return `
            <div class="row">
                <div class="mainrow">
                    <div class="row_title">${categoryKey}:</div>
                    <div class="row_value">${mainRowValueHtml}</div>
                </div>
                ${subrowsHtml}
            </div>
        `;
    };

    // Function to render the entire table view
    const renderTableView = (portfolio) => {
        const tableView = document.getElementById('table_view');
        let html = '';

        // Render each category in order
        const categoryOrder = ['Equity', 'Crypto', 'Liquidity', 'Commodities'];
        for (const categoryKey of categoryOrder) {
            if (portfolio[categoryKey]) {
                html += renderCategoryRow(categoryKey, portfolio[categoryKey]);
            }
        }

        tableView.innerHTML = html;
    };

    // fetchData payload Example
    // {"total":366067.48,"Equity":{"total":107000.83,"details":{"LU1829221024":{"quantity":534,"value":78.31,"total":41817.54,"displayName":"Nasdaq ETF"}}},"Crypto":{"total":109066.65,"details":{"BTC":{"quantity":0.78,"value":86680.8,"total":67611.02,"displayName":"Bitcoin"},"USDT":{"quantity":3365,"value":0.94,"total":3179.26,"displayName":"USDT"}}},"Liquidity":{"total":30000,"details":{"conto arancio":{"quantity":1,"value":30000,"total":30000,"displayName":"ING"}}}}
    // url = 'http://localhost:8085/portfolio?refresh=true'
    const fetchData = async (refresh) => {
        const response = await fetch('http://localhost:8085/portfolio?refresh=' + refresh);
        const data = await response.json();
        return data;
    }

    const getPortfolio = async (refresh) => {
        let portfolio = JSON.parse(localStorage.getItem('portfolio') || null) || null;
        // Force refresh if displayName is missing or categories are missing (cache from old version)
        const needsRefresh = portfolio && (
            (portfolio.Equity?.details && Object.values(portfolio.Equity.details).some(d => !d.displayName)) ||
            !portfolio.Commodities ||
            !portfolio.Equity
        );
        if (portfolio === null || refresh || needsRefresh) {
            const refreshButton = document.getElementById('refresh_button');
            refreshButton.disabled = true;
            refreshButton.innerHTML = 'Refreshing...';
            const newPortfolio = await fetchData(refresh);
            localStorage.setItem('portfolio', JSON.stringify(newPortfolio));
            refreshButton.disabled = false;
            refreshButton.innerHTML = 'Refresh';
            return newPortfolio;
        }
        return portfolio;
    }

    const renderPortfolio = async (refresh) => {
        // Show cached data first (if available) so old values remain visible during refresh
        let portfolio = JSON.parse(localStorage.getItem('portfolio') || null);
        if (portfolio) {
            renderPortfolioData(portfolio);
        }
        
        // Fetch new data if needed
        portfolio = await getPortfolio(refresh);
        renderPortfolioData(portfolio);
    }

    const renderPortfolioData = (portfolio) => {
        const total = portfolio.total;
        const prevMonthTotal = portfolio.prevMonthTotal;

        const initYearNetworth = 383770.95;
        const delta = total - initYearNetworth;
        const deltaPercentage = (delta / initYearNetworth) * 100;
        const deltaPercentageLabel = deltaPercentage > 0 ? '🚀' : '🔥';
        const prevMonthdelta = total - prevMonthTotal;
        const prevMonthdeltaPercentage = (prevMonthdelta / prevMonthTotal) * 100;
        const prevMonthdeltaPercentageLabel = prevMonthdeltaPercentage > 0 ? '🚀' : '🔥';

        const yearGoalTarget = 342857.14;
        const yearGoalDelta = total - yearGoalTarget;
        const yearGoalLabel = yearGoalDelta > 0 ? '🚀' : '🔥';

        // Update overview values
        document.getElementById('total_value').innerHTML = t(total);
        document.getElementById('delta_value').innerHTML = t(deltaPercentage) + '%' + deltaPercentageLabel;
        document.getElementById('deltagoal_value').innerHTML = t(yearGoalDelta) + yearGoalLabel;
        document.getElementById('prevMonth_delta_value').innerHTML = t(prevMonthdeltaPercentage) + '%' + prevMonthdeltaPercentageLabel;

        // Show/hide error banner based on failures
        const errorBanner = document.getElementById('error_banner');
        const errorList = document.getElementById('error_list');
        if (portfolio.failures && portfolio.failures.length > 0) {
            errorList.innerHTML = portfolio.failures.join(', ') + ' (using cached values if available)';
            errorBanner.classList.add('visible');
        } else {
            errorBanner.classList.remove('visible');
        }

        // Render the table view dynamically
        renderTableView(portfolio);
    }

    renderPortfolio();
</script>
</html>
